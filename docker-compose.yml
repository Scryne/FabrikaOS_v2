# FabrikaOS — yerel/dev yığını.
# NOT: imaj etiketleri Docker ortamında doğrulandıktan sonra kesin sürüme sabitlenmeli.
name: fabrikaos

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fabrikaos:fabrikaos@db:5432/fabrikaos
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"          # doğrudan erişim (birincil): http://localhost:8000/saglik
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fabrikaos-api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.fabrikaos-api.entrypoints=web"
      - "traefik.http.services.fabrikaos-api.loadbalancer.server.port=8000"
    networks: [fabrikaos]

  # S8: Bulut Ingestion Worker — MQTT abonesi, saha ölçümlerini tenant şemasına yazar.
  ingestion:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fabrikaos:fabrikaos@db:5432/fabrikaos
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    command: ["python", "-m", "app.ingestion.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    networks: [fabrikaos]

  # S-VB: outbox → kişi-hedefli bildirim (uygulama içi zil + e-posta). Bu süreç olmadan
  # bildirim merkezi hiç dolmaz; API yalnız olayı outbox'a yazar (ADR-0021).
  bildirim:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fabrikaos:fabrikaos@db:5432/fabrikaos
      REDIS_URL: redis://redis:6379/0
    command: ["python", "backend/scripts/bildirim_uretici.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fabrikaos]

  # S18: outbox → imzalı webhook teslimatı (retry/backoff). API'den ayrı süreç (ADR-0020).
  webhook-relay:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fabrikaos:fabrikaos@db:5432/fabrikaos
      REDIS_URL: redis://redis:6379/0
    command: ["python", "backend/scripts/webhook_relay.py"]
    depends_on:
      db:
        condition: service_healthy
    networks: [fabrikaos]

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: fabrikaos
      POSTGRES_PASSWORD: fabrikaos
      POSTGRES_DB: fabrikaos
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrikaos -d fabrikaos"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [fabrikaos]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [fabrikaos]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fabrikaos
      MINIO_ROOT_PASSWORD: fabrikaos-minio-parola
    ports:
      - "9000:9000"          # S3 API
      - "9001:9001"          # konsol
    volumes:
      - minio-data:/data
    networks: [fabrikaos]

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    networks: [fabrikaos]

  traefik:
    image: traefik:v3.2
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"      # SADECE dev; prod'da kapatılır (Faz 5)
    ports:
      - "80:80"
      - "8080:8080"                # dev panosu: http://localhost:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [fabrikaos]

volumes:
  db-data:
  minio-data:

networks:
  fabrikaos:
    driver: bridge
