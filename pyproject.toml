[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabrikaos"
version = "0.1.0"
description = "FabrikaOS — Cok kiracili (multi-tenant) MES + ERP SaaS platformu"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Scryne" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

# Kod backend/app altinda; wheel'de 'app' paketi olur.
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# --- Ruff (lint + format; 🔧 black yerine tek arac) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- mypy (strict) ---
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
files = ["backend/app"]
plugins = ["pydantic.mypy"]

# --- pytest ---
[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-ra -q"
