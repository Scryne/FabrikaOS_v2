name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check backend

      - name: Ruff (format kontrolü)
        run: ruff format --check backend

      - name: mypy (tip kontrolü)
        run: mypy

      - name: pytest (birim + entegrasyon)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (biçim kontrolü)
        run: npm run format:check

      - name: TypeScript (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Vitest (birim + bileşen)
        run: npm test

      - name: Vite build
        run: npm run build

  # NOT: Güvenlik (pip-audit/bandit), Playwright E2E (S7), build ve deploy adımları
  # sonraki sprintlerde eklenecek.
