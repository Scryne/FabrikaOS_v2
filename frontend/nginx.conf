server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Parmak izli derleme çıktıları değişmez: uzun önbellek.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: tanımsız yol index.html'e düşer, istemci yönlendiricisi (404 ekranı dahil) karar verir.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
