[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabrikaos"
version = "0.1.0"
description = "FabrikaOS — Cok kiracili (multi-tenant) MES + ERP SaaS platformu"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Scryne" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- S2: cok kiracililik + kimlik/RBAC ---
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "argon2-cffi>=23.1",     # argon2id parola ozetleme
    "pyjwt[crypto]>=2.9",    # OAuth2/JWT (crypto ekstrasi: OIDC id_token RS256 dogrulamasi)
    "python-multipart>=0.0.9",  # OAuth2 sifre akisi (form verisi)
    "httpx>=0.27",          # S23: OIDC discovery/JWKS/token endpoint cagrilari (async)
    "redis>=5.0",           # refresh iptal listesi + rate limit
    "aiomqtt>=2.3",         # S8: edge + ingestion MQTT istemcisi (async)
    "minio>=7.2",           # S12: DYS nesne depolama (MinIO/S3)
    "pandas>=2.2",          # S13: AI feature pipeline
    "scikit-learn>=1.5",    # S13: AI/ML modelleri
    "joblib>=1.4",          # S13: model artefakt serileştirme
    "reportlab>=4.2",       # S14: PDF rapor üretimi
    "openpyxl>=3.1",        # S14: Excel (xlsx) rapor üretimi
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",  # entegrasyon testleri icin ephemeral PostgreSQL
    "fakeredis>=2.25",                # Redis bagimli testler icin
]

# Kod backend/app altinda; wheel'de 'app' paketi olur.
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# --- Ruff (lint + format; 🔧 black yerine tek arac) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "edge"]
# Autogenerate edilen Alembic revision dosyaları lint'ten muaf (üretilmiş kod).
extend-exclude = ["backend/migrations/*/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "edge"]

# --- mypy (strict) ---
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
files = ["backend/app", "edge"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiomqtt.*", "minio.*", "pandas.*", "sklearn.*", "joblib.*", "reportlab.*", "openpyxl.*"]
ignore_missing_imports = true

# --- pytest ---
[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
testpaths = ["backend/tests", "edge/tests"]
addopts = "-ra -q"
filterwarnings = [
    # joblib içi NumPy 2.5 deprecation'ı (üçüncü parti; S13 model yüklemede tetikleniyor)
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.*",
]
