# FabrikaOS Alembic yapılandırması — İKİ migration ağacı (fan-out).
#
#   [public] → control-plane tabloları (public şema). Bir kez uygulanır.
#   [tenant] → iş modülü tabloları. public + tüm aktif tenant_<slug> şemalarına fan-out edilir.
#
# Kullanım:
#   alembic --name public  upgrade head
#   alembic --name tenant  upgrade head        # tum aktif tenant semalarina
#   alembic --name tenant -x schema=tenant_sablon revision --autogenerate -m "..."
#
# DB URL env.py içinde çözülür (settings/DATABASE_URL); buraya yazılmaz.

[public]
script_location = %(here)s/backend/migrations/public
version_path_separator = os
path_separator = os
prepend_sys_path = %(here)s/backend

[tenant]
script_location = %(here)s/backend/migrations/tenant
version_path_separator = os
path_separator = os
prepend_sys_path = %(here)s/backend

# --- Loglama ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
