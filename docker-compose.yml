# FabrikaOS — yerel/dev yığını.
# NOT: imaj etiketleri Docker ortamında doğrulandıktan sonra kesin sürüme sabitlenmeli.
name: fabrikaos

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fabrikaos:fabrikaos@db:5432/fabrikaos
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      # S19: boş = kapalı. `gozlem` profiliyle: OTEL_ENDPOINT=http://jaeger:4318
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8000:8000"          # doğrudan erişim (birincil): http://localhost:8000/saglik
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fabrikaos-api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.fabrikaos-api.entrypoints=web"
      - "traefik.http.services.fabrikaos-api.loadbalancer.server.port=8000"
    networks: [fabrikaos]

  # S8: Bulut Ingestion Worker — MQTT abonesi, saha ölçümlerini tenant şemasına yazar.
  ingestion:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fabrikaos:fabrikaos@db:5432/fabrikaos
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      ISCI_METRIK_PORTU: "9101"   # S19: Prometheus kazıması (fabrikaos-isci işi)
    command: ["python", "-m", "app.ingestion.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    networks: [fabrikaos]

  # S-VB: outbox → kişi-hedefli bildirim (uygulama içi zil + e-posta). Bu süreç olmadan
  # bildirim merkezi hiç dolmaz; API yalnız olayı outbox'a yazar (ADR-0021).
  bildirim:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fabrikaos:fabrikaos@db:5432/fabrikaos
      REDIS_URL: redis://redis:6379/0
      ISCI_METRIK_PORTU: "9101"
    command: ["python", "backend/scripts/bildirim_uretici.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fabrikaos]

  # S18: outbox → imzalı webhook teslimatı (retry/backoff). API'den ayrı süreç (ADR-0020).
  webhook-relay:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fabrikaos:fabrikaos@db:5432/fabrikaos
      REDIS_URL: redis://redis:6379/0
      ISCI_METRIK_PORTU: "9101"
    command: ["python", "backend/scripts/webhook_relay.py"]
    depends_on:
      db:
        condition: service_healthy
    networks: [fabrikaos]

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: fabrikaos
      POSTGRES_PASSWORD: fabrikaos
      POSTGRES_DB: fabrikaos
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrikaos -d fabrikaos"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [fabrikaos]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [fabrikaos]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fabrikaos
      MINIO_ROOT_PASSWORD: fabrikaos-minio-parola
    ports:
      - "9000:9000"          # S3 API
      - "9001:9001"          # konsol
    volumes:
      - minio-data:/data
    networks: [fabrikaos]

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    networks: [fabrikaos]

  traefik:
    image: traefik:v3.2
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"      # SADECE dev; prod'da kapatılır (Faz 5)
    ports:
      - "80:80"
      - "8080:8080"                # dev panosu: http://localhost:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [fabrikaos]

  # --- S19 gözlemlenebilirlik (ADR-0040): `docker compose --profile gozlem up` ---------------
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [gozlem]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=35d"     # 30 günlük SLO penceresi + pay
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/kurallar:/etc/prometheus/kurallar:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [fabrikaos]

  alertmanager:
    image: prom/alertmanager:v0.34.2
    profiles: [gozlem]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./infra/alertmanager/gizli:/etc/alertmanager/gizli:ro   # nobet_webhook_url (depoda değil)
    ports:
      - "9093:9093"
    networks: [fabrikaos]

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [gozlem]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PAROLA:-yerel-grafana}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/panolar/fabrikaos-sli.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/panolar:/var/lib/grafana/panolar:ro
    ports:
      - "3000:3000"
    networks: [fabrikaos]

  loki:
    image: grafana/loki:3.7.9
    profiles: [gozlem]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [fabrikaos]

  alloy:
    image: grafana/alloy:v1.21.3
    profiles: [gozlem]
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [fabrikaos]

  # OTLP/HTTP 4318 alır, arayüz 16686. Bellek içi saklama: dev/staging içindir.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [gozlem]
    ports:
      - "16686:16686"
    networks: [fabrikaos]

volumes:
  db-data:
  minio-data:
  prometheus-data:
  loki-data:

networks:
  fabrikaos:
    driver: bridge
