name: CI

# Yalnız doküman / not değişen commit'te CI koşmaz (özel repo Actions dakikası, 2026-10-26).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".claude/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Entegrasyon testleri gerçek bir veritabanına bağlanır (conftest localhost:5432).
      # create_hypertable için TimescaleDB imajı şart; eklenti template1'e kurulur, böylece
      # conftest'in oluşturduğu fabrikaos_test veritabanı eklentiyi devralır.
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: fabrikaos
          POSTGRES_PASSWORD: fabrikaos
          POSTGRES_DB: fabrikaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabrikaos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check backend

      - name: Ruff (format kontrolü)
        run: ruff format --check backend

      - name: mypy (tip kontrolü)
        run: mypy

      - name: API portalı güncel mi (docs/api, S28)
        run: python backend/scripts/api_portali.py --kontrol

      - name: pytest (birim + entegrasyon)
        run: pytest

      - name: Statik güvenlik taraması (bandit, orta ve üstü)
        # B608 (SQL'e metin birleştirme) 22 noktada tek tek incelendi: birleştirilen yalnız beyaz
        # liste ifadeleri, sema_adi() ile doğrulanmış şema adları ve katalogdan gelen tırnaklı tablo
        # adları (docs/operasyon/guvenlik-ve-performans.md). Yeni SQL birleştirme kod incelemesinde.
        run: |
          pip install "bandit>=1.8"
          bandit -r backend/app -ll -q -s B608

      - name: Bağımlılık güvenliği (pip-audit)
        run: |
          pip install pip-audit
          pip freeze --exclude-editable > /tmp/gereksinimler.txt
          pip-audit -r /tmp/gereksinimler.txt --no-deps --disable-pip

  # S19: alarm kuralları kod gibi test edilir (her alarm tetiklenen + tetiklenmeyen seriyle).
  gozlem-kurallari:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: promtool check + test rules
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/p" -w /p --entrypoint promtool             prom/prometheus:v3.15.1 check rules kurallar/fabrikaos.yml
          docker run --rm -v "$PWD/infra/prometheus:/p" -w /p/testler --entrypoint promtool             prom/prometheus:v3.15.1 test rules kurallar_test.yml
      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD/infra/alertmanager:/a" --entrypoint amtool             prom/alertmanager:v0.34.2 check-config /a/alertmanager.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (biçim kontrolü)
        run: npm run format:check

      - name: TypeScript (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Vitest (birim + bileşen)
        run: npm test

      - name: Vite build
        run: npm run build

      - name: Bağımlılık güvenliği (npm audit, yüksek/kritik)
        run: npm audit --audit-level=high

  # S28 (ADR-0047): kritik saf çekirdekte mutasyon skoru eşiği. Veritabanı gerekmez (birim testler).
  mutasyon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıkları kur
        run: pip install -e ".[dev]"
      - name: Mutasyon testi (eşik %90)
        run: python backend/scripts/mutasyon.py --isci 4 --esik 90

  # S28 (ADR-0047): OpenAPI tabanlı sertleştirme — schemathesis tüm uçlarda 5xx arar (stateful dahil).
  sertlestirme:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: fabrikaos
          POSTGRES_PASSWORD: fabrikaos
          POSTGRES_DB: fabrikaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabrikaos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıkları kur
        run: pip install -e ".[dev]"
      - name: Schemathesis taraması (5xx yok)
        run: >-
          python backend/scripts/sertlestirme.py
          --db-url postgresql+asyncpg://fabrikaos:fabrikaos@localhost:5432/fabrikaos_sertlik
          --redis-url redis://localhost:6379/3
          --rapor sertlestirme-junit.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sertlestirme-raporu
          path: sertlestirme-junit.xml
          if-no-files-found: ignore

  # S28 (ADR-0047): her build'de CycloneDX SBOM (backend ortamı + ön yüz üretim bağımlılıkları).
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend ortamını kur
        run: pip install -e . cyclonedx-bom==7.2.1
      - name: Backend SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom-backend.json
      - name: Ön yüz SBOM
        working-directory: frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@2.1.0 --omit dev --output-file ../sbom-frontend.json
      - uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ github.sha }}
          path: sbom-*.json
          retention-days: 90

  # NOT: Playwright E2E (çalışan yığın + seed'li tenant ister) ve deploy adımları CI'da yok;
  # E2E yerelde `npm run test:e2e` ile koşar.
