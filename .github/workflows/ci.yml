name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Entegrasyon testleri gerçek bir veritabanına bağlanır (conftest localhost:5432).
      # create_hypertable için TimescaleDB imajı şart; eklenti template1'e kurulur, böylece
      # conftest'in oluşturduğu fabrikaos_test veritabanı eklentiyi devralır.
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: fabrikaos
          POSTGRES_PASSWORD: fabrikaos
          POSTGRES_DB: fabrikaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabrikaos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check backend

      - name: Ruff (format kontrolü)
        run: ruff format --check backend

      - name: mypy (tip kontrolü)
        run: mypy

      - name: pytest (birim + entegrasyon)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (biçim kontrolü)
        run: npm run format:check

      - name: TypeScript (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Vitest (birim + bileşen)
        run: npm test

      - name: Vite build
        run: npm run build

  # NOT: Güvenlik (pip-audit/bandit), Playwright E2E (S7), build ve deploy adımları
  # sonraki sprintlerde eklenecek.
