name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check backend

      - name: Ruff (format kontrolü)
        run: ruff format --check backend

      - name: mypy (tip kontrolü)
        run: mypy

      - name: pytest (birim + entegrasyon)
        run: pytest

  # NOT: Güvenlik (pip-audit/bandit), build ve deploy adımları sonraki
  # sprintlerde eklenecek (S2'de CI'ya postgres+migrasyon fan-out testi gelir).
